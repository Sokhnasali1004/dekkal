<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon compte — Dëkkal</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dekkal sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">Dëk<span>kal</span></a>
    <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#nav-principale">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav-principale">
      <ul class="navbar-nav mx-auto gap-lg-3">
        <li class="nav-item"><a class="nav-link" href="index.html">Accueil</a></li>
        <li class="nav-item"><a class="nav-link" href="catalogue.html">Catalogue</a></li>
        <li class="nav-item"><a class="nav-link" href="panier.html">Panier <span class="badge-panier" data-badge-panier>0</span></a></li>
      </ul>
      <div data-zone-compte></div>
    </div>
  </div>
</nav>

<section class="container py-5">

  <div id="zone-auth" class="row justify-content-center g-4">
    <div class="col-md-5">
      <div class="carte-panneau h-100">
        <h2 class="fs-3">Connexion</h2>
        <form id="forme-connexion">
          <div class="mb-3">
            <label>Email</label>
            <input type="email" name="email" class="form-control" required>
          </div>
          <div class="mb-3">
            <label>Mot de passe</label>
            <input type="password" name="motDePasse" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-dekkal w-100">Se connecter</button>
        </form>
      </div>
    </div>
    <div class="col-md-5">
      <div class="carte-panneau h-100">
        <h2 class="fs-3">Créer un compte</h2>
        <form id="forme-inscription">
          <div class="mb-3">
            <label>Nom complet</label>
            <input type="text" name="nom" class="form-control" required>
          </div>
          <div class="mb-3">
            <label>Email</label>
            <input type="email" name="email" class="form-control" required>
          </div>
          <div class="mb-3">
            <label>Mot de passe</label>
            <input type="password" name="motDePasse" class="form-control" minlength="6" required>
          </div>
          <div class="mb-3">
            <label>Ville</label>
            <input type="text" name="ville" class="form-control" placeholder="Dakar, Saint-Louis…">
          </div>
          <div class="mb-3">
            <label>Je m'inscris comme</label>
            <select name="role" class="form-select">
              <option value="acheteur">Acheteur</option>
              <option value="vendeur">Vendeur</option>
            </select>
          </div>
          <button type="submit" class="btn btn-dekkal w-100">S'inscrire</button>
        </form>
      </div>
    </div>
  </div>

  <div id="zone-profil" class="row justify-content-center g-4 d-none">
    <div class="col-md-8">
      <div class="carte-panneau mb-4">
        <div class="d-flex justify-content-between align-items-start">
          <div>
            <h2 class="fs-3 mb-1" data-nom></h2>
            <p class="meta mb-0" data-email></p>
            <p class="meta mb-0">Rôle : <span data-role></span> · Ville : <span data-ville></span></p>
          </div>
          <button id="btn-deconnexion-profil" class="btn btn-dekkal-outline">Se déconnecter</button>
        </div>
      </div>

      <div class="carte-panneau mb-4">
        <h3 class="fs-5">Mes annonces</h3>
        <div id="zone-mes-produits"><p class="meta">Chargement…</p></div>
      </div>

      <div class="carte-panneau">
        <h3 class="fs-5">Mes commandes</h3>
        <div id="zone-mes-commandes"><p class="meta">Chargement…</p></div>
      </div>
    </div>
  </div>

</section>

<footer class="footer-dekkal mt-5">
  <div class="container text-center">
    <p class="small mb-0">© Dëkkal — marketplace sénégalaise de vêtements de seconde main.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/main.js"></script>
<script type="module" src="js/compte.js"></script>
</body>
</html>
