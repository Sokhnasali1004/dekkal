<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panier — Dëkkal</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dekkal sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">Dëk<span>kal</span></a>
    <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#nav-principale">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav-principale">
      <ul class="navbar-nav mx-auto gap-lg-3">
        <li class="nav-item"><a class="nav-link" href="index.html">Accueil</a></li>
        <li class="nav-item"><a class="nav-link" href="catalogue.html">Catalogue</a></li>
        <li class="nav-item"><a class="nav-link active" href="panier.html">Panier <span class="badge-panier" data-badge-panier>0</span></a></li>
      </ul>
      <div data-zone-compte></div>
    </div>
  </div>
</nav>

<section class="container py-5">
  <h1 class="fs-2 mb-4">Votre panier</h1>
  <div class="row g-4">
    <div class="col-lg-7">
      <div id="zone-panier-liste" class="carte-panneau"></div>
    </div>
    <div class="col-lg-5">
      <div class="carte-panneau">
        <p class="d-flex justify-content-between fs-5">
          <span>Total</span>
          <strong><span id="zone-panier-total">0</span> FCFA</strong>
        </p>

        <div id="zone-connexion-requise" class="alert alert-warning d-none">
          <a href="compte.html">Connectez-vous</a> pour finaliser votre commande.
        </div>

        <form id="forme-commande" class="d-none">
          <div class="mb-3">
            <label>Adresse de livraison</label>
            <input type="text" name="adresseLivraison" class="form-control" required>
          </div>
          <div class="mb-3">
            <label>Téléphone de contact</label>
            <input type="tel" name="telephoneContact" class="form-control" required>
          </div>
          <div class="mb-3">
            <label>Mode de paiement</label>
            <select name="modePaiement" class="form-select">
              <option>Paiement à la livraison</option>
              <option>Wave</option>
              <option>Orange Money</option>
            </select>
          </div>
          <button type="submit" class="btn btn-dekkal w-100">Valider la commande</button>
        </form>
      </div>
    </div>
  </div>
</section>

<footer class="footer-dekkal mt-5">
  <div class="container text-center">
    <p class="small mb-0">© Dëkkal — marketplace sénégalaise de vêtements de seconde main.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/main.js"></script>
<script type="module" src="js/panier.js"></script>
</body>
</html>
